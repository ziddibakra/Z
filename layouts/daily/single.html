{{ define "main" }}
  <article class="report" data-nabz-day="{{ .Params.iso_date }}">
    <a class="back" href="{{ "daily/" | relURL }}">← Daily</a>
    <h1>{{ .Params.folder }}</h1>
    <p class="intro">Captured at {{ .Date.Format "15:04 MST" }}</p>
    <div class="report-grid">
      {{ with .Params.strategy_today }}<section class="report-card"><h2>Today's Strategy P&amp;L</h2>{{ $src := printf "daily/%s/%s" $.Params.folder . | relURL }}<a class="chart-link" href="{{ $src }}"><img src="{{ $src }}" alt="Today's Strategy P&amp;L for {{ $.Params.folder }}"></a></section>{{ end }}
    </div>
  </article>
{{ end }}
